<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>留言板 · Xinka 信卡</title>
<meta name="description" content="Xinka 留言板——留言经审核后公开显示。">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:#1a1a2e; background:#fafafa; line-height:1.8; }
  .top { background:#302b63; color:#fff; padding:18px 24px; }
  .top a { color:#cfc9ff; text-decoration:none; }
  .wrap { max-width:760px; margin:0 auto; padding:40px 24px 80px; }
  h1 { font-size:1.7rem; color:#302b63; margin-bottom:6px; }
  .sub { color:#777; font-size:.92rem; margin-bottom:28px; }
  .form { background:#fff; border:1px solid #e8e8f0; border-radius:12px; padding:26px; box-shadow:0 2px 12px rgba(48,43,99,.05); }
  label { display:block; font-size:.92rem; font-weight:600; color:#302b63; margin:14px 0 6px; }
  input, textarea { width:100%; padding:11px 14px; border:1px solid #ddd; border-radius:8px; font-size:.95rem; font-family:inherit; }
  textarea { min-height:110px; resize:vertical; }
  input:focus, textarea:focus { outline:none; border-color:#6c63ff; }
  .hp { position:absolute; left:-9999px; opacity:0; height:0; }
  button { margin-top:18px; width:100%; padding:13px; background:#6c63ff; color:#fff; border:none; border-radius:8px; font-size:1.02rem; cursor:pointer; }
  button:hover { background:#5a52e0; }
  button:disabled { background:#aaa; }
  .note { font-size:.82rem; color:#999; margin-top:12px; }
  .result { margin-top:14px; padding:12px 16px; border-radius:8px; display:none; }
  .ok { background:#e8f8ee; color:#1a7a3a; }
  .err { background:#fde8e8; color:#a33; }
  h2 { font-size:1.25rem; color:#302b63; margin:44px 0 16px; }
  .msg { background:#fff; border:1px solid #e8e8f0; border-radius:10px; padding:18px 20px; margin-bottom:12px; }
  .msg .meta { font-size:.82rem; color:#888; margin-bottom:6px; }
  .msg .body { font-size:.95rem; }
  .empty { color:#aaa; text-align:center; padding:30px; }
  @media(max-width:600px){ .wrap{padding:24px 16px 60px;} }
</style>
</head>
<body>
<div class="top"><a href="/">← xinka.ai 首页</a> &nbsp;·&nbsp; 留言板</div>
<div class="wrap">
  <h1>💬 留言板</h1>
  <p class="sub">留言经审核后公开显示。欢迎建议、反馈与合作洽谈——重要留言会直接转达。</p>

  <div class="form">
    <label>昵称（可留空=匿名）</label>
    <input id="name" maxlength="50" placeholder="怎么称呼您">
    <label>联系方式（可选·仅对管理可见）</label>
    <input id="contact" maxlength="100" placeholder="邮箱 / 微信 · 方便回复您">
    <label>留言内容</label>
    <textarea id="content" maxlength="1000" placeholder="建议、反馈、合作意向……（1000 字以内）"></textarea>
    <!-- 蜜罐字段·真人看不见不填·机器人必填 -->
    <input id="website" class="hp" tabindex="-1" autocomplete="off" placeholder="请留空">
    <button id="btn" onclick="submit()">提交留言</button>
    <div id="result" class="result"></div>
    <p class="note">提交后进入审核队列，通过后上墙。垃圾留言会被过滤。</p>
  </div>

  <h2>已通过的留言</h2>
  <div id="list"><div class="empty">加载中…</div></div>
</div>

<script>
async function submit() {
  const btn = document.getElementById('btn');
  const r = document.getElementById('result');
  const content = document.getElementById('content').value.trim();
  if (!content) { r.className='result err'; r.style.display='block'; r.textContent='留言内容不能为空'; return; }
  btn.disabled = true; btn.textContent = '提交中…';
  try {
    const res = await fetch('/api/submit', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        name: document.getElementById('name').value.trim(),
        contact: document.getElementById('contact').value.trim(),
        content: content,
        website: document.getElementById('website').value  // 蜜罐
      })
    });
    const d = await res.json();
    if (d.ok) {
      r.className='result ok'; r.style.display='block';
      r.textContent='✅ 留言已收到，审核后上墙。感谢！';
      document.getElementById('content').value='';
    } else {
      r.className='result err'; r.style.display='block';
      r.textContent='⚠️ ' + (d.error || '提交失败');
    }
  } catch(e) {
    r.className='result err'; r.style.display='block'; r.textContent='⚠️ 网络错误，请稍后再试';
  }
  btn.disabled = false; btn.textContent = '提交留言';
}

async function load() {
  try {
    const d = await (await fetch('/api/list')).json();
    const el = document.getElementById('list');
    if (!d.msgs || !d.msgs.length) { el.innerHTML='<div class="empty">暂无留言，来做第一个吧 ☕</div>'; return; }
    el.innerHTML = d.msgs.map(m =>
      `<div class="msg"><div class="meta">${m.name} · ${m.date}</div><div class="body">${m.content.replace(/</g,'&lt;')}</div></div>`
    ).join('');
  } catch(e) {}
}
load();
</script>
</body>
</html>
